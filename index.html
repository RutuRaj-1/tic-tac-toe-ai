
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <meta
        name="description"
        content="Tic Tac Toe against an unbeatable Minimax AI."
    />

    <title>Tic Tac Toe — Minimax AI</title>
    <link rel="stylesheet" href="/style.css" />
</head>

<body>
    <main class="app">
        <header class="app-header">
            <p class="eyebrow">PHASER 3 · ARTIFICIAL INTELLIGENCE</p>
            <h1>Tic Tac Toe</h1>
            <p class="subtitle">
                You play X. The AI plays O.
            </p>
        </header>

        <section
            class="game-panel"
            aria-label="Tic Tac Toe game"
        >
            <div id="game-container"></div>
        </section>

        <footer class="app-footer">
            <span>Powered by Minimax</span>
            <span>Human vs Computer</span>
        </footer>
    </main>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
